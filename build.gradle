import java.nio.file.Files

// The root build file defines tasks that apply to the whole repository.
plugins {
    // The base plugin gives the root project standard lifecycle tasks like clean and check.
    id 'base'
    // This plugin adds validateDesignControlPack and the legacy designControlStatus alias.
    id 'mxjb.docs-validation-conventions'
    // This plugin adds printOfflineBuildInstructions for contributors working without internet access.
    id 'mxjb.offline-conventions'
}

// group and version form the first two parts of Maven coordinates: group:name:version.
group = 'io.github.mundanej'

// The version normally comes from gradle.properties, but this fallback keeps local experiments usable.
version = providers.gradleProperty('mxjb.version').getOrElse('0.1.0-SNAPSHOT')

// These projects should be included when someone asks for one whole-repository check.
// Keeping the list explicit makes the public root tasks easy to audit.
def checkedProjects = [
    ':modules:mxjb-bom',
    ':modules:runtime-core',
    ':modules:runtime-jdkxml',
    ':modules:generator-api',
    ':modules:generator-core',
    ':modules:generator-cli',
    ':modules:generator-gradle-plugin',
    ':modules:testing-support',
    ':modules:conformance-tests',
    ':examples:purchase-order',
    ':examples:multi-namespace',
]

// These projects are the only publishable artifacts for the current release dry-run.
def publishedProjects = [
    ':modules:mxjb-bom',
    ':modules:runtime-core',
    ':modules:runtime-jdkxml',
    ':modules:generator-api',
    ':modules:generator-core',
    ':modules:generator-cli',
    ':modules:generator-gradle-plugin',
    ':modules:testing-support',
]

// The BOM has no Java source code, so quality tools such as Spotless and JaCoCo do not run there.
def qualityProjects = checkedProjects.findAll { it != ':modules:mxjb-bom' }

// checkAll is a contributor-friendly shortcut for running each included project's check task.
tasks.register('checkAll') {
    group = 'verification'
    description = 'Runs check tasks across all included mundane XSD Java Binding projects.'
    dependsOn checkedProjects.collect { "${it}:check" }
}

// qualityGate is the main local and CI gate: docs must exist, checks must pass, formatting must pass,
// and coverage verification must run for projects that have compiled classes.
tasks.register('qualityGate') {
    group = 'verification'
    description = 'Runs the default local quality gate.'
    dependsOn 'validateDesignControlPack', 'checkAll'
    dependsOn qualityProjects.collect { "${it}:spotlessCheck" }
    dependsOn qualityProjects.collect { "${it}:jacocoTestCoverageVerification" }
}

// nativeSmoke is intentionally separate from qualityGate because it requires GraalVM native-image.
tasks.register('nativeSmoke') {
    group = 'verification'
    description = 'Runs the representative GraalVM Native Image smoke lane.'
    dependsOn ':modules:runtime-core:nativeTest'
    dependsOn ':modules:runtime-jdkxml:nativeTest'
    dependsOn ':modules:generator-core:generatedCodeNativeSmoke'
    dependsOn ':examples:purchase-order:nativeTest'
    dependsOn ':examples:multi-namespace:nativeTest'
}

// nativeConformance is intentionally separate from qualityGate because it requires GraalVM
// native-image and runs selected conformance fixtures beyond the smoke lane.
tasks.register('nativeConformance') {
    group = 'verification'
    description = 'Runs the selected GraalVM Native Image conformance lane.'
    dependsOn ':modules:conformance-tests:nativeConformance'
}

// benchmarkSmoke is intentionally separate from qualityGate because its measurements are advisory.
tasks.register('benchmarkSmoke') {
    group = 'verification'
    description = 'Runs the advisory generated-binding benchmark smoke lane.'
    dependsOn ':modules:conformance-tests:benchmarkSmoke'
}

// w3cXsd10Conformance is intentionally opt-in because it requires a local external W3C suite
// checkout supplied with -Pmxjb.w3cXsd10SuiteDir and is not part of the stable JVM quality gate.
tasks.register('w3cXsd10Conformance') {
    group = 'verification'
    description = 'Classifies a local pinned W3C XML Schema 1.0 test suite checkout.'
    dependsOn ':modules:conformance-tests:w3cXsd10Conformance'
}

def publicationStagingDirectory = layout.buildDirectory.dir('staging-repository')
def publicationCandidateVersion = version.toString()
def releaseDryRunNotes = layout.projectDirectory.file('docs/infrastructure/release-notes-1.0.0.md')
def releaseWorkflow = layout.projectDirectory.file('.github/workflows/release.yml')
def repositoryRootPath = rootDir.absolutePath

tasks.register('cleanPublicationStaging', Delete) {
    group = 'publishing'
    description = 'Removes the local publication staging repository.'
    delete publicationStagingDirectory
}

tasks.register('stagePublications') {
    group = 'publishing'
    description = 'Publishes approved artifacts to the local staging repository.'
    dependsOn publishedProjects.collect { "${it}:publishAllPublicationsToLocalStagingRepository" }
    mustRunAfter tasks.named('cleanPublicationStaging')
}

gradle.projectsEvaluated {
    publishedProjects.each { projectPath ->
        project(projectPath).tasks.matching {
            it.name.startsWith('publish') && it.name.endsWith('PublicationToLocalStagingRepository')
        }.configureEach {
            dependsOn rootProject.tasks.named('cleanPublicationStaging')
        }
    }
}

tasks.register('validatePublicationStaging') {
    group = 'verification'
    description = 'Validates the local publication staging repository layout and metadata.'
    dependsOn tasks.named('stagePublications')
    inputs.dir(publicationStagingDirectory)
    inputs.file(releaseDryRunNotes)
    inputs.file(releaseWorkflow)
    doLast {
        def repository = publicationStagingDirectory.get().asFile
        if (!repository.isDirectory()) {
            throw new GradleException("Missing publication staging repository: ${repository}")
        }

        def candidateVersion = publicationCandidateVersion
        def expectedArtifacts = [
            [group: 'io.github.mundanej', artifact: 'mxjb-bom', files: ['pom', 'module']],
            [group: 'io.github.mundanej', artifact: 'mxjb-runtime-core', files: ['pom', 'module', 'jar', 'sources.jar', 'javadoc.jar']],
            [group: 'io.github.mundanej', artifact: 'mxjb-runtime-jdkxml', files: ['pom', 'module', 'jar', 'sources.jar', 'javadoc.jar']],
            [group: 'io.github.mundanej', artifact: 'mxjb-generator-api', files: ['pom', 'module', 'jar', 'sources.jar', 'javadoc.jar']],
            [group: 'io.github.mundanej', artifact: 'mxjb-generator-core', files: ['pom', 'module', 'jar', 'sources.jar', 'javadoc.jar']],
            [group: 'io.github.mundanej', artifact: 'mxjb-cli', files: ['pom', 'module', 'jar', 'sources.jar', 'javadoc.jar']],
            [group: 'io.github.mundanej', artifact: 'mxjb-gradle-plugin', files: ['pom', 'module', 'jar', 'sources.jar', 'javadoc.jar']],
            [group: 'io.github.mundanej', artifact: 'mxjb-testing-support', files: ['pom', 'module', 'jar', 'sources.jar', 'javadoc.jar']],
            [group: 'io.github.mundanej.mxjb', artifact: 'io.github.mundanej.mxjb.gradle.plugin', files: ['pom']],
        ]
        def coordinateDirectory = { artifact ->
            new File(repository, "${artifact.group.replace('.', '/')}/${artifact.artifact}/${candidateVersion}")
        }
        def artifactFileName = { artifact, suffix ->
            if (['pom', 'module', 'jar'].contains(suffix)) {
                return "${artifact.artifact}-${candidateVersion}.${suffix}"
            }
            return "${artifact.artifact}-${candidateVersion}-${suffix}"
        }
        def expectedVersionDirectories = expectedArtifacts.collect { coordinateDirectory(it).canonicalFile } as Set
        def stagedFiles = []
        repository.eachFileRecurse(groovy.io.FileType.FILES) { stagedFile ->
            stagedFiles.add(stagedFile)
        }

        expectedArtifacts.each { artifact ->
            def artifactDirectory = coordinateDirectory(artifact)
            if (!artifactDirectory.isDirectory()) {
                throw new GradleException("Missing staged coordinate directory: ${artifactDirectory}")
            }
            artifact.files.each { suffix ->
                def expectedFile = new File(artifactDirectory, artifactFileName(artifact, suffix))
                if (!expectedFile.isFile()) {
                    throw new GradleException("Missing staged artifact file: ${expectedFile}")
                }
            }
        }

        stagedFiles.findAll { it.name.endsWith("-${candidateVersion}.pom") }.each { pomFile ->
            if (!expectedVersionDirectories.contains(pomFile.parentFile.canonicalFile)) {
                throw new GradleException("Unexpected staged publication metadata: ${pomFile}")
            }
        }

        def stagedMetadata = stagedFiles.findAll {
            it.name.endsWith('.pom') || it.name.endsWith('.module') || it.name.endsWith('.xml')
        }
        def forbiddenMetadataFragments = [
            repositoryRootPath,
            repository.absolutePath,
            'generator-gradle-plugin',
            '.m2',
        ]
        stagedMetadata.each { metadataFile ->
            def metadataText = metadataFile.getText('UTF-8')
            forbiddenMetadataFragments.each { fragment ->
                if (metadataText.contains(fragment)) {
                    throw new GradleException("Forbidden metadata fragment '${fragment}' found in ${metadataFile}")
                }
            }
            ['password', 'secret', 'token'].each { secretWord ->
                if (metadataText.toLowerCase(Locale.ROOT).contains(secretWord)) {
                    throw new GradleException("Secret-like metadata word '${secretWord}' found in ${metadataFile}")
                }
            }
        }

        def stagedPaths = stagedFiles.collect { repository.toPath().relativize(it.toPath()).toString() }
        ['conformance-tests', 'examples', 'build-logic', '.m2'].each { forbiddenPath ->
            if (stagedPaths.any { it.contains(forbiddenPath) }) {
                throw new GradleException("Forbidden staged path fragment '${forbiddenPath}' found")
            }
        }
        if (stagedPaths.any { it.startsWith('.gradle/') || it.contains('/.gradle/') }) {
            throw new GradleException("Forbidden staged Gradle cache path found")
        }

        def releaseNotes = releaseDryRunNotes.asFile
        if (!releaseNotes.isFile()) {
            throw new GradleException("Missing release dry-run notes: ${releaseNotes}")
        }
        def releaseNotesText = releaseNotes.getText('UTF-8')
        [
            'GitHub Release assets only',
            'No Maven Central publication is performed',
            'No signing keys, credentials, or remote staging repositories are configured',
            'XSD 1.1 and XML 1.1 support are not claimed',
            'XML Canonicalization is not claimed',
        ].each { requiredPhrase ->
            if (!releaseNotesText.contains(requiredPhrase)) {
                throw new GradleException("Release notes missing required non-claim phrase: ${requiredPhrase}")
            }
        }

        def workflow = releaseWorkflow.asFile
        if (!workflow.isFile()) {
            throw new GradleException("Missing GitHub Release workflow: ${workflow}")
        }
        def workflowText = workflow.getText('UTF-8')
        [
            'tags:',
            "'v1.0.0'",
            'gh release create',
            'publicationDryRun',
            'contents: write',
        ].each { requiredFragment ->
            if (!workflowText.contains(requiredFragment)) {
                throw new GradleException("Release workflow missing required fragment: ${requiredFragment}")
            }
        }
        ['mavenCentral', 'signing', 'OSSRH', 'publishAllPublicationsTo'].each { forbiddenFragment ->
            if (workflowText.contains(forbiddenFragment)) {
                throw new GradleException("Release workflow contains forbidden fragment: ${forbiddenFragment}")
            }
        }

        println "Validated ${expectedArtifacts.size()} staged publication coordinates for ${candidateVersion}."
    }
}

tasks.register('publicationDryRun') {
    group = 'publishing'
    description = 'Stages approved Maven artifacts locally and validates release metadata without publishing remotely.'
    dependsOn tasks.named('validatePublicationStaging')
}

def releaseConsumerSmokeDirectory = layout.buildDirectory.dir('release-consumer-smoke')
def gradleExecutablePath = new File(
        gradle.gradleHomeDir,
        "bin/gradle${System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? '.bat' : ''}").absolutePath

tasks.register('releaseConsumerSmoke') {
    group = 'verification'
    description = 'Validates staged GitHub Release Maven-layout assets from a clean downstream project.'
    dependsOn tasks.named('publicationDryRun')
    inputs.dir(publicationStagingDirectory)
    outputs.dir(releaseConsumerSmokeDirectory)
    doLast {
        def smokeDirectory = releaseConsumerSmokeDirectory.get().asFile
        if (smokeDirectory.exists() && !smokeDirectory.deleteDir()) {
            throw new GradleException("Unable to delete release consumer smoke directory: ${smokeDirectory}")
        }
        smokeDirectory.mkdirs()

        def assetZip = new File(smokeDirectory, "mxjb-staging-repository-${publicationCandidateVersion}.zip")
        def assetRepository = new File(smokeDirectory, 'asset-repository')
        def stagedRepository = publicationStagingDirectory.get().asFile
        def stagedRoot = stagedRepository.toPath()
        new java.util.zip.ZipOutputStream(new BufferedOutputStream(new FileOutputStream(assetZip))).withCloseable { zip ->
            Files.walk(stagedRoot).withCloseable { paths ->
                paths.filter { Files.isRegularFile(it) }.forEach { path ->
                    def entryName = stagedRoot.relativize(path).toString().replace(File.separatorChar, '/' as char)
                    zip.putNextEntry(new java.util.zip.ZipEntry(entryName))
                    Files.copy(path, zip)
                    zip.closeEntry()
                }
            }
        }
        assetRepository.mkdirs()
        def assetRoot = assetRepository.toPath()
        new java.util.zip.ZipInputStream(new BufferedInputStream(new FileInputStream(assetZip))).withCloseable { zip ->
            def entry = zip.nextEntry
            while (entry != null) {
                def target = assetRoot.resolve(entry.name).normalize()
                if (!target.startsWith(assetRoot)) {
                    throw new GradleException("Release consumer smoke zip entry escapes output directory: ${entry.name}")
                }
                if (entry.directory) {
                    Files.createDirectories(target)
                } else {
                    Files.createDirectories(target.parent)
                    Files.copy(zip, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
                zip.closeEntry()
                entry = zip.nextEntry
            }
        }

        def consumerProject = new File(smokeDirectory, 'consumer-project')
        ReleaseConsumerProjectWriter.write(consumerProject)

        def runConsumerGradle = { File repository, List<String> arguments ->
            def command = ([gradleExecutablePath] + arguments +
                    ["-Pmxjb.consumer.repo=${repository.absolutePath}", '--offline', '--console=plain'])
                    .collect { it.toString() }
            def processBuilder = new ProcessBuilder(command)
                    .directory(consumerProject)
                    .redirectErrorStream(true)
            processBuilder.environment().put('GRADLE_USER_HOME', new File(smokeDirectory, 'gradle-user-home').absolutePath)
            def process = processBuilder.start()
            def output = process.inputStream.getText('UTF-8')
            [exitValue: process.waitFor(), output: output]
        }

        def missing = runConsumerGradle(new File(smokeDirectory, 'missing-repository'), ['help'])
        if (missing.exitValue == 0 || !missing.output.contains('Configured release artifact repository does not exist')) {
            throw new GradleException("Consumer smoke missing-repository diagnostic failed:\n${missing.output}")
        }

        def valid = runConsumerGradle(assetRepository, ['clean', 'runConsumerSmoke'])
        if (valid.exitValue != 0) {
            throw new GradleException("Consumer smoke build failed:\n${valid.output}")
        }
        if (!valid.output.contains('release-consumer-smoke ok')) {
            throw new GradleException("Consumer smoke did not run generated binding round trip:\n${valid.output}")
        }
        println "Validated downstream release asset consumption for ${publicationCandidateVersion}."
    }
}

class ReleaseConsumerProjectWriter {
static void write(File projectDirectory) {
    def schemaDirectory = new File(projectDirectory, 'src/main/resources/schema')
    def sourceDirectory = new File(projectDirectory, 'src/main/java/com/example/consumer')
    schemaDirectory.mkdirs()
    sourceDirectory.mkdirs()
    new File(projectDirectory, 'settings.gradle').text = '''
        pluginManagement {
            def releaseRepoPath = providers.gradleProperty('mxjb.consumer.repo').orNull
            if (releaseRepoPath == null || releaseRepoPath.isBlank()) {
                throw new GradleException('mxjb.consumer.repo is required for release consumer smoke.')
            }
            def releaseRepo = file(releaseRepoPath)
            if (!releaseRepo.isDirectory()) {
                throw new GradleException("Configured release artifact repository does not exist: ${releaseRepo}")
            }
            repositories {
                maven { url = releaseRepo.toURI() }
            }
        }
        dependencyResolutionManagement {
            def releaseRepoPath = providers.gradleProperty('mxjb.consumer.repo').orNull
            if (releaseRepoPath == null || releaseRepoPath.isBlank()) {
                throw new GradleException('mxjb.consumer.repo is required for release consumer smoke.')
            }
            def releaseRepo = file(releaseRepoPath)
            if (!releaseRepo.isDirectory()) {
                throw new GradleException("Configured release artifact repository does not exist: ${releaseRepo}")
            }
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                maven { url = releaseRepo.toURI() }
            }
        }
        rootProject.name = 'mxjb-release-consumer-smoke'
        '''.stripIndent()
    new File(projectDirectory, 'build.gradle').text = '''
        plugins {
            id 'java'
            id 'io.github.mundanej.mxjb' version '1.0.0'
        }

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        dependencies {
            implementation platform('io.github.mundanej:mxjb-bom:1.0.0')
            implementation 'io.github.mundanej:mxjb-runtime-core'
            implementation 'io.github.mundanej:mxjb-runtime-jdkxml'
        }

        mxjb {
            schema('src/main/resources/schema/purchase-order.xsd')
            namespacePackage('urn:purchase', 'com.example.purchase')
        }

        tasks.register('runConsumerSmoke', JavaExec) {
            dependsOn tasks.named('classes')
            classpath = sourceSets.main.runtimeClasspath
            mainClass = 'com.example.consumer.ConsumerSmoke'
        }
        '''.stripIndent()
    new File(schemaDirectory, 'purchase-order.xsd').text = '''
        <xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema"
            targetNamespace="urn:purchase"
            xmlns:p="urn:purchase"
            elementFormDefault="qualified"
            attributeFormDefault="qualified">
          <xs:element name="order" type="p:Order"/>
          <xs:complexType name="Order">
            <xs:sequence>
              <xs:element name="id" type="xs:string"/>
              <xs:element name="line" type="p:Line" maxOccurs="unbounded"/>
            </xs:sequence>
            <xs:attribute name="version" type="xs:string" use="optional"/>
          </xs:complexType>
          <xs:complexType name="Line">
            <xs:sequence>
              <xs:element name="sku" type="xs:string"/>
              <xs:element name="quantity" type="xs:int"/>
            </xs:sequence>
          </xs:complexType>
        </xs:schema>
        '''.stripIndent()
    new File(sourceDirectory, 'ConsumerSmoke.java').text = '''
        package com.example.consumer;

        import com.example.purchase.Order;
        import com.example.purchase.xml.OrderXmlReader;
        import com.example.purchase.xml.OrderXmlValidator;
        import com.example.purchase.xml.OrderXmlWriter;
        import io.github.mundanej.mxjb.runtime.ValidationResult;
        import io.github.mundanej.mxjb.runtime.XmlEventReader;
        import io.github.mundanej.mxjb.runtime.XmlOutput;
        import io.github.mundanej.mxjb.runtime.jdkxml.JdkXmlAdapters;
        import java.io.StringReader;
        import java.io.StringWriter;
        import javax.xml.stream.XMLInputFactory;
        import javax.xml.stream.XMLOutputFactory;
        import javax.xml.stream.XMLStreamReader;
        import javax.xml.stream.XMLStreamWriter;

        public final class ConsumerSmoke {
          private ConsumerSmoke() {}

          public static void main(String[] args) throws Exception {
            String xml = """
                <p:order xmlns:p="urn:purchase" p:version="1.0">
                  <p:id>PO-RELEASE</p:id>
                  <p:line><p:sku>SKU-1</p:sku><p:quantity>2</p:quantity></p:line>
                </p:order>
                """;
            Order order = OrderXmlReader.read(readerFor(xml));
            ValidationResult objectValidation = OrderXmlValidator.validate(order);
            if (!objectValidation.isValid()) {
              throw new IllegalStateException("Generated object validation failed: " + objectValidation);
            }
            String written = writeXml(order);
            Order reread = OrderXmlReader.read(readerFor(written));
            if (!order.equals(reread)) {
              throw new IllegalStateException("Generated binding round trip changed the model.");
            }
            ValidationResult xmlValidation = OrderXmlValidator.validate(readerFor(written));
            if (!xmlValidation.isValid()) {
              throw new IllegalStateException("Generated XML validation failed: " + xmlValidation);
            }
            System.out.println("release-consumer-smoke ok");
          }

          private static String writeXml(Order order) throws Exception {
            StringWriter target = new StringWriter();
            XMLStreamWriter streamWriter = XMLOutputFactory.newFactory().createXMLStreamWriter(target);
            XmlOutput output = JdkXmlAdapters.output(streamWriter);
            output.startDocument();
            OrderXmlWriter.write(output, order);
            output.endDocument();
            output.flush();
            streamWriter.close();
            return target.toString();
          }

          private static XmlEventReader readerFor(String xml) throws Exception {
            XMLInputFactory factory = JdkXmlAdapters.secureInputFactory();
            XMLStreamReader streamReader = factory.createXMLStreamReader(new StringReader(xml));
            return JdkXmlAdapters.eventReader(streamReader);
          }
        }
        '''.stripIndent()
}
}

// This help task prints the artifacts that publishToMavenLocal or a real publish will create.
tasks.register('printPublishedArtifacts') {
    group = 'help'
    description = 'Prints planned artifact coordinates.'
    doLast {
        println '''
:modules:mxjb-bom                 -> io.github.mundanej:mxjb-bom
:modules:runtime-core             -> io.github.mundanej:mxjb-runtime-core
:modules:runtime-jdkxml           -> io.github.mundanej:mxjb-runtime-jdkxml
:modules:generator-api            -> io.github.mundanej:mxjb-generator-api
:modules:generator-core           -> io.github.mundanej:mxjb-generator-core
:modules:generator-cli            -> io.github.mundanej:mxjb-cli
:modules:generator-gradle-plugin  -> io.github.mundanej:mxjb-gradle-plugin
:modules:testing-support          -> io.github.mundanej:mxjb-testing-support
'''.stripIndent()
    }
}

// Keep the old task name available while docs and scripts move to printPublishedArtifacts.
tasks.register('listPublishedArtifacts') {
    group = 'help'
    description = 'Compatibility alias for printPublishedArtifacts.'
    dependsOn tasks.named('printPublishedArtifacts')
}
