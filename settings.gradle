// This file tells Gradle which projects exist and where plugins/dependencies come from.
pluginManagement {
    // If xsdbind.offlineRepo is set, Gradle will use that local Maven-style folder instead of the internet.
    def offlineRepoPath = providers.gradleProperty('xsdbind.offlineRepo').orNull

    // build-logic is an included build that contains our custom convention plugins.
    includeBuild 'build-logic'

    // These repositories are used only for resolving Gradle plugins.
    repositories {
        if (offlineRepoPath != null && !offlineRepoPath.isBlank()) {
            // Offline mode: read plugins from the local repository path supplied by the user or CI.
            maven { url = uri(offlineRepoPath) }
        } else {
            // Online mode: use the standard plugin repository plus Maven Central for plugin markers.
            gradlePluginPortal()
            mavenCentral()
        }
    }
}

// This block controls normal project dependencies such as JUnit, SpotBugs, and inter-module libraries.
dependencyResolutionManagement {
    // Read the same offline repository property for regular dependencies.
    def offlineRepoPath = providers.gradleProperty('xsdbind.offlineRepo').orNull

    // Keep repository declarations centralized here so subprojects cannot quietly add new repositories.
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    // These repositories are used for resolving normal libraries.
    repositories {
        if (offlineRepoPath != null && !offlineRepoPath.isBlank()) {
            // Offline mode: all dependencies must already be in this local repository.
            maven { url = uri(offlineRepoPath) }
        } else {
            // Online mode: Maven Central is the only allowed dependency repository.
            mavenCentral()
        }
    }
}

// This is the name Gradle shows for the root project.
rootProject.name = 'xsd-bind-java'

// Publishable and test-support modules live under modules/.
include ':modules:xsdbind-bom'
include ':modules:runtime-core'
include ':modules:runtime-jdkxml'
include ':modules:generator-api'
include ':modules:generator-core'
include ':modules:generator-cli'
include ':modules:generator-gradle-plugin'
include ':modules:testing-support'
include ':modules:conformance-tests'

// Examples live under examples/ because they are not published as library artifacts.
include ':examples:purchase-order'
include ':examples:multi-namespace'
