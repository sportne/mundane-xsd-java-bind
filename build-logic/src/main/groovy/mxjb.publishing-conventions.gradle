// Use this plugin for Java modules that should produce Maven artifacts.
plugins {
    // Gives the module group/version, reproducible archives, and dependency locking.
    id 'mxjb.identity-conventions'
    // Adds Maven publication tasks such as publishToMavenLocal.
    id 'maven-publish'
}

def configureProjectPom = { MavenPublication publication ->
    publication.pom {
        // These values show up in generated Maven POM files.
        name = publication.artifactId ?: project.name
        description = project.description ?: project.name
        url = 'https://github.com/sportne/mundane-xsd-java-bind'
        licenses {
            license {
                // Apache 2.0 is the declared project license.
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        scm {
            url = 'https://github.com/sportne/mundane-xsd-java-bind'
            connection = 'scm:git:https://github.com/sportne/mundane-xsd-java-bind.git'
            developerConnection = 'scm:git:ssh://git@github.com/sportne/mundane-xsd-java-bind.git'
        }
        developers {
            developer {
                id = 'mundanej'
                name = 'mundane XSD Java Binding maintainers'
                url = 'https://github.com/sportne/mundane-xsd-java-bind'
            }
        }
    }
}

publishing {
    publications {
        // mavenJava is the normal publication name for a Java library.
        if (!project.plugins.hasPlugin('java-gradle-plugin')) {
            mavenJava(MavenPublication) {
                // Publish the compiled jar, sources jar, Javadoc jar, and dependency metadata.
                from components.java
            }
        }
        withType(MavenPublication).configureEach { publication ->
            configureProjectPom(publication)
        }
    }
    repositories {
        maven {
            // Local staging lets contributors inspect publication output without uploading anywhere.
            name = 'localStaging'
            url = rootProject.layout.buildDirectory.dir('staging-repository')
        }
    }
}
