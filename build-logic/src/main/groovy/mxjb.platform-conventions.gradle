// Use this plugin for BOM projects. A BOM publishes dependency alignment, not Java classes.
plugins {
    // Gives the BOM the same group/version and reproducible archive settings as other modules.
    id 'mxjb.identity-conventions'
    // Adds Gradle's javaPlatform component, which is how Gradle models a Maven BOM.
    id 'java-platform'
    // Adds publishing support.
    id 'maven-publish'
}

javaPlatform {
    // Allows the BOM to contain dependency constraints for our other projects.
    allowDependencies()
}

def configureProjectPom = { MavenPublication publication ->
    publication.pom {
        name = publication.artifactId ?: project.name
        description = project.description ?: project.name
        url = 'https://github.com/sportne/mundane-xsd-java-bind'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        scm {
            url = 'https://github.com/sportne/mundane-xsd-java-bind'
            connection = 'scm:git:https://github.com/sportne/mundane-xsd-java-bind.git'
            developerConnection = 'scm:git:ssh://git@github.com/sportne/mundane-xsd-java-bind.git'
        }
        developers {
            developer {
                id = 'mundanej'
                name = 'mundane XSD Java Binding maintainers'
                url = 'https://github.com/sportne/mundane-xsd-java-bind'
            }
        }
    }
}

publishing {
    publications {
        // Publish the javaPlatform component as a Maven BOM publication.
        mavenBom(MavenPublication) {
            from components.javaPlatform
        }
        withType(MavenPublication).configureEach { publication ->
            configureProjectPom(publication)
        }
    }
    repositories {
        maven {
            // Local staging is a build output folder used for inspection before real publishing exists.
            name = 'localStaging'
            url = rootProject.layout.buildDirectory.dir('staging-repository')
        }
    }
}
