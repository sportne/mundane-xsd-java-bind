// This convention plugin configures JaCoCo, the Java code coverage tool.
import org.gradle.api.artifacts.VersionCatalogsExtension

plugins {
    // Adds jacocoTestReport and jacocoTestCoverageVerification tasks.
    id 'jacoco'
}

// Read versions from gradle/libs.versions.toml instead of repeating them in this file.
def libs = extensions.getByType(VersionCatalogsExtension).named('libs')

// Main class files are the compiled production classes. Empty scaffold modules do not have any yet.
def mainClasses = sourceSets.main.output.classesDirs

// These thresholds mirror docs/verification/coverage-policy.md.
// Projects with no compiled production classes still skip coverage verification.
def coverageThresholdsByProject = [
    ':modules:runtime-core': [line: '0.90', branch: '0.80', sourceLine: '0.80'],
    ':modules:runtime-jdkxml': [line: '0.90', branch: '0.80', sourceLine: '0.80'],
    ':modules:generator-core': [line: '0.85', branch: '0.75', sourceLine: '0.75'],
    ':modules:generator-api': [line: '0.75', branch: '0.65', sourceLine: '0.65'],
    ':modules:generator-cli': [line: '0.75', branch: '0.65', sourceLine: '0.65'],
    ':modules:generator-gradle-plugin': [line: '0.75', branch: '0.65', sourceLine: '0.65'],
    ':examples:purchase-order': [line: '0.75', branch: '0.65', sourceLine: '0.65'],
    ':examples:multi-namespace': [line: '0.75', branch: '0.65', sourceLine: '0.65'],
    ':modules:testing-support': [line: '0.70', branch: '0.60', sourceLine: '0.60'],
    ':modules:conformance-tests': [line: '0.70', branch: '0.60', sourceLine: '0.60'],
]
def coverageThresholds = coverageThresholdsByProject.get(project.path)

jacoco {
    // Pin the JaCoCo version so local machines and CI use the same tool.
    toolVersion = libs.findVersion('jacoco').get().requiredVersion
}

// After tests run, ask Gradle to create the coverage report too.
tasks.withType(Test).configureEach {
    finalizedBy tasks.named('jacocoTestReport')
}

// Configure the HTML/XML coverage report task.
tasks.named('jacocoTestReport') {
    // Coverage reports need test execution data, so tests must run first.
    dependsOn tasks.named('test')
    // Scaffold modules with no compiled main classes skip coverage instead of failing uselessly.
    onlyIf { mainClasses.files.any { it.exists() && it.listFiles() } }
    reports {
        // XML is useful for CI tools.
        xml.required = true
        // HTML is useful for humans reading the report locally.
        html.required = true
        // CSV is not needed for this project.
        csv.required = false
    }
}

// Configure coverage verification. Empty scaffold modules skip this task, but implemented modules
// enforce the documented thresholds so coverage regressions fail the normal check and qualityGate.
tasks.named('jacocoTestCoverageVerification') {
    // Coverage verification needs execution data, so direct calls should run tests first.
    dependsOn tasks.named('test')
    // Skip empty modules until they contain compiled production classes.
    onlyIf { mainClasses.files.any { it.exists() && it.listFiles() } }
    violationRules {
        rule {
            enabled = true
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = new BigDecimal(coverageThresholds.line)
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = new BigDecimal(coverageThresholds.branch)
            }
        }
        rule {
            enabled = true
            element = 'SOURCEFILE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = new BigDecimal(coverageThresholds.sourceLine)
            }
        }
    }
}

// Make the normal Gradle check task include coverage verification.
tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
