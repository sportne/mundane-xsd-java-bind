// Use this plugin for modules that produce a runnable command-line application.
plugins {
    // Adds application tasks such as run, startScripts, and installDist.
    id 'application'
    // A runnable app is still Java code, so it also gets the standard Java library setup.
    id 'xsdbind.java-conventions'
}

application {
    // Main classes are assigned when implementation entry points are introduced.
    // Until then, application modules can still share the same build shape as future real apps.
}
