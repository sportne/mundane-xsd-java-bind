// This module build file is intentionally small. Shared Gradle setup lives in build-logic.
plugins {
    // Application packaging for a future command-line entry point.
    id 'mxjb.application-conventions'
    // Formatting, Checkstyle, and SpotBugs checks.
    id 'mxjb.quality-conventions'
    // JaCoCo coverage reports and verification.
    id 'mxjb.coverage-conventions'
    // Maven publication setup for published Java artifacts.
    id 'mxjb.publishing-conventions'
    // GraalVM Native Image compatibility checks for the CLI.
    id 'mxjb.native-conventions'
}

// Human-readable module purpose shown in Gradle reports and generated Maven metadata.
description = 'Command-line generator entry point for supported schema-to-Java generation.'

application {
    mainClass = 'io.github.mundanej.mxjb.generator.cli.MxjbCli'
}

publishing {
    publications {
        // Published Maven artifact name for the command-line tool.
        mavenJava(MavenPublication) {
            artifactId = 'mxjb-cli'
        }
    }
}

dependencies {
    // The CLI reads public configuration types from the generator API.
    implementation project(':modules:generator-api')
    // The CLI delegates generation work to the core generator implementation.
    implementation project(':modules:generator-core')
}
