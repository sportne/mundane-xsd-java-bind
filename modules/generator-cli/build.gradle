plugins {
    id 'xsdbind.java-conventions'
    id 'xsdbind.quality-conventions'
    id 'xsdbind.coverage-conventions'
    id 'xsdbind.publishing-conventions'
}

description = 'Command-line generator entry point; intentionally empty in v0.1.'

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'xsdbind-cli'
        }
    }
}

dependencies {
    implementation project(':modules:generator-api')
    implementation project(':modules:generator-core')
}
