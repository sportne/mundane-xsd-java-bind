// This module build file is intentionally small. Shared Gradle setup lives in build-logic.
plugins {
    // Standard Java 21 library setup, test defaults, and dependency locking.
    id 'mxjb.java-conventions'
    // Declares the public Gradle plugin marker and implementation class.
    id 'java-gradle-plugin'
    // Formatting, Checkstyle, and SpotBugs checks.
    id 'mxjb.quality-conventions'
    // JaCoCo coverage reports and verification.
    id 'mxjb.coverage-conventions'
    // Maven publication setup for published Java libraries.
    id 'mxjb.publishing-conventions'
}

// Human-readable module purpose shown in Gradle reports and generated Maven metadata.
description = 'Gradle integration for schema generation.'

gradlePlugin {
    plugins {
        mxjb {
            id = 'io.github.mundanej.mxjb'
            implementationClass = 'io.github.mundanej.mxjb.generator.gradle.MxjbGradlePlugin'
        }
    }
}

publishing {
    publications {
        // Published Maven artifact name for the Gradle integration artifact.
        pluginMaven(MavenPublication) {
            artifactId = 'mxjb-gradle-plugin'
        }
        withType(MavenPublication).configureEach { publication ->
            pom {
                name = publication.artifactId
            }
        }
    }
}

afterEvaluate {
    publishing.publications.named('mxjbPluginMarkerMaven', MavenPublication).configure {
        pom {
            name = 'io.github.mundanej.mxjb.gradle.plugin'
        }
    }
}

dependencies {
    // The Gradle plugin exposes and consumes the public generator API.
    implementation project(':modules:generator-api')
    // The first plugin slice delegates to the accepted generator-core pipeline.
    implementation project(':modules:generator-core')
    // Gradle TestKit is provided by Gradle and does not add external dependency metadata.
    testImplementation gradleTestKit()
}

tasks.withType(Test).configureEach {
    dependsOn ':modules:runtime-core:classes'
    systemProperty 'mxjb.runtimeCoreClasses',
            project(':modules:runtime-core').sourceSets.main.output.classesDirs.asPath
    systemProperty 'mxjb.repoRoot', rootProject.layout.projectDirectory.asFile.absolutePath
}
