// This module build file is intentionally small. Shared Gradle setup lives in build-logic.
plugins {
    // Standard Java 21 library setup, test defaults, and dependency locking.
    id 'mxjb.java-conventions'
    // Formatting, Checkstyle, and SpotBugs checks.
    id 'mxjb.quality-conventions'
    // JaCoCo coverage reports and verification.
    id 'mxjb.coverage-conventions'
}

// Human-readable module purpose shown in Gradle reports and generated metadata.
description = 'Internal conformance test harness; not published.'

dependencies {
    // Representative example bindings are the conformance fixtures for TASK-0017.
    testImplementation project(':examples:multi-namespace')
    testImplementation project(':examples:purchase-order')
    // TASK-0023 conformance generates accepted choice bindings from fixture schemas.
    testImplementation project(':modules:generator-core')
    // Conformance tests use the optional JDK StAX adapter to feed runtime-core events.
    testImplementation project(':modules:runtime-jdkxml')
    // Conformance tests reuse shared test helpers from the testing-support module.
    testImplementation project(':modules:testing-support')
}
