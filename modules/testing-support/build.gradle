// This module build file is intentionally small. Shared Gradle setup lives in build-logic.
plugins {
    // Standard Java 21 library setup, test defaults, and dependency locking.
    id 'xsdbind.java-conventions'
    // Formatting, Checkstyle, and SpotBugs checks.
    id 'xsdbind.quality-conventions'
    // JaCoCo coverage reports and verification.
    id 'xsdbind.coverage-conventions'
    // Maven publication setup for published Java libraries.
    id 'xsdbind.publishing-conventions'
    // GraalVM Native Image compatibility checks for shared test helpers.
    id 'xsdbind.native-conventions'
}

// Human-readable module purpose shown in Gradle reports and generated Maven metadata.
description = 'Test helpers for generated bindings; intentionally empty in v0.1.'

publishing {
    publications {
        // Published Maven artifact name for reusable testing helpers.
        mavenJava(MavenPublication) {
            artifactId = 'xsdbind-testing-support'
        }
    }
}

dependencies {
    // api means users of testing-support also see runtime-core test helper types.
    api project(':modules:runtime-core')
}
